[Settings]
; ==============================================================================
; StreamInRadius (Float, meters)
; Distance at which parked cars automatically spawn into the game world.
; ------------------------------------------------------------------------------
; Performance Impact : Low-Medium. Larger radii spawn more vehicles simultaneously.
; Suggested Values   : 
;   - Debug / Low End PC : 30.0  to 50.0  (Minimal RAM/CPU usage)
;   - Balanced           : 100.0 to 150.0 (Recommended, zero visual popping)
;   - High Quality       : 200.0 to 300.0 (Ultra view distance)
; ==============================================================================
StreamInRadius=150.0

; ==============================================================================
; StreamOutRadius (Float, meters)
; Distance at which parked cars despawn from game memory to save RAM & FPS.
; NOTE: Keep 20-30 meters larger than StreamInRadius to avoid spawn flickering!
; ------------------------------------------------------------------------------
; Performance Impact : Medium. Despawns vehicles to keep FPS high.
; Suggested Values   : 
;   - Debug / Low End PC : 45.0  to 70.0
;   - Balanced           : 120.0 to 170.0 (Recommended)
;   - High Quality       : 230.0 to 330.0
; ==============================================================================
StreamOutRadius=170.0

; ==============================================================================
; MaxEntries (Integer)
; Maximum number of persistent vehicle spots stored in cleo/vehicles.parked.
; Oldest vehicle entries are automatically removed when this limit is reached.
; ------------------------------------------------------------------------------
; Performance Impact : 0% CPU impact due to dynamic proximity streaming.
;                      Each 100 entries uses < 15 KB of disk storage.
; Suggested Values   : 
;   - Lightweight        : 25 to 50
;   - Standard           : 100 (Recommended)
;   - Massive World      : 250 to 500
; ==============================================================================
MaxEntries=100

; ==============================================================================
; MenuKeyCode (Integer, Virtual Key Code)
; Key to open/close the Parked Vehicles Menu.
; Default: 117 (F6). Key Code Reference: F6 = 117, F5 = 116, F7 = 118, M = 77.
; ==============================================================================
MenuKeyCode=117

; ==============================================================================
; SpawnerKeyCode (Integer, Virtual Key Code)
; Key to open/close the Safe Car Spawner Menu.
; Default: 116 (F5). Key Code Reference: F5 = 116, F6 = 117, F7 = 118.
; ==============================================================================
SpawnerKeyCode=116

; ==============================================================================
; AutoUnlockDoors (Integer: 1 = Enabled, 0 = Disabled)
; Automatically unlocks doors on spawned parked vehicles so CJ can enter freely.
; ------------------------------------------------------------------------------
; Performance Impact : None (0.00% CPU/RAM).
; Suggested Values   : 1 (Enabled - Recommended)
; ==============================================================================
AutoUnlockDoors=1

; ==============================================================================
; EnableTooltips (Integer: 1 = Enabled, 0 = Disabled)
; Displays green/yellow help text popups on vehicle exit or vehicle claim.
; ------------------------------------------------------------------------------
; Performance Impact : None (0.00% CPU/RAM).
; Suggested Values   : 
;   - 1 (Enabled  - Shows coordinates & tuning info)
;   - 0 (Disabled - Pure clean HUD)
; ==============================================================================
EnableTooltips=1

; ==============================================================================
; EnableF7Key (Integer: 1 = Enabled, 0 = Disabled)
; Enables pressing F7 to force INI reload, re-stream vehicles & clean area.
; ------------------------------------------------------------------------------
; Performance Impact : None (Key is polled with 0% CPU overhead).
; Suggested Values   : 
;   - 1 (Enabled  - Useful for testing & debugging)
;   - 0 (Disabled - Immersive gameplay, prevents accidental keypresses)
; ==============================================================================
EnableF7Key=1

; ==============================================================================
; SaveVehicleHealth (Integer: 1 = Enabled, 0 = Disabled)
; Saves current vehicle health (damage) on exit and restores it when respawning.
; ------------------------------------------------------------------------------
; Performance Impact : None (0.00% CPU/RAM).
; Suggested Values   : 
;   - 1 (Enabled  - Preserves exact vehicle damage condition)
;   - 0 (Disabled - Respawns vehicles with 100% full health)
; ==============================================================================
SaveVehicleHealth=1

; ==============================================================================
; SavePoppedTires (Integer: 1 = Enabled, 0 = Disabled)
; Saves flat/popped tires on vehicle exit and restores them when respawning.
; ------------------------------------------------------------------------------
; Performance Impact : None (0.00% CPU/RAM).
; Suggested Values   : 
;   - 1 (Enabled  - Preserves flat/burst tire status)
;   - 0 (Disabled - Respawns vehicles with intact tires)
; ==============================================================================
SavePoppedTires=1

; ==============================================================================
; TagLicensePlates (Integer: 1 = Enabled, 0 = Disabled)
; Automatically tags stored/parked vehicles with a custom license plate text.
; ------------------------------------------------------------------------------
; Performance Impact : None (0.00% CPU/RAM).
; Suggested Values   : 
;   - 1 (Enabled  - Recommended, visually identifies stored vehicles in-game)
;   - 0 (Disabled - Keep original game license plates)
; ==============================================================================
TagLicensePlates=1

; ==============================================================================
; CustomPlateText (String, max 8 characters)
; License plate text applied to stored/parked vehicles (e.g. PARKED, GARAGE, SAVED).
; ==============================================================================
CustomPlateText=PARKED
